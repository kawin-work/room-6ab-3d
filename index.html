    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="stylesheet" href="_ds/modernist-0abcea01-7eef-4cee-934f-46bc4e873855/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
  html,body{margin:0;height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body),'Noto Sans Thai',sans-serif}
  a{color:var(--color-accent-700)} a:hover{color:var(--color-accent)}
  three-d-stage:not(:defined){visibility:hidden}
</style>
</head>
<body>
<div style="display:grid;grid-template-rows:auto 1fr;height:100vh">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4,16px);flex-wrap:wrap;padding:12px 20px;border-bottom:2px solid var(--color-divider)">
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);font-weight:700">ผัง 3D · ห้อง 6 AB</div>
      <div style="font-family:var(--font-heading),'Noto Sans Thai',sans-serif;font-weight:700;font-size:20px">งานทำบุญห้อง 6 AB</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="views">
      <button class="btn btn-primary" data-view="oblique">มุมเฉียง</button>
      <button class="btn btn-secondary" data-view="top">มุมบน</button>
      <button class="btn btn-secondary" data-view="back">มุมท้ายห้อง</button>
      <button class="btn btn-secondary" data-view="front">มุมอาสน์สงฆ์</button>
      <button class="btn btn-ghost" id="toggleLabels">ซ่อนป้าย</button>
    </div>
  </header>
  <div style="position:relative;min-height:0">
    <three-d-stage name="room-6ab-3d" background="#f3f2f2" style="position:absolute;inset:0;width:100%;height:100%"></three-d-stage>
    <div id="labels" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
    <div style="position:absolute;left:16px;bottom:16px;max-width:260px;background:var(--color-surface,#fff);border:2px solid var(--color-divider);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px">
      <div style="font-weight:700;font-size:13px">สรุปจำนวนเก้าอี้</div>
      <div style="font-size:13px">เก้าอี้อบรม : 15 แถว × 30 ตัว = 450 ตัว</div>
      <div style="border-top:2px solid var(--color-divider);padding-top:6px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px">
        <span>พระสงฆ์</span><span>9 + 9 ที่ (2 แถว)</span>
        <span>โซฟาผู้บริหาร</span><span>16 ที่</span>
        <span>โต๊ะกลม</span><span>พระ 8 รูป</span>
        <span>ห้อง</span><span>≈ 23.8 × 37.8 ม.</span>
      </div>
    </div>
  </div>
</div>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const W = 23.8, D = 37.8, OX = -W/2, OZ = -D/2;
const P = (px) => (px - 160) / 45, Q = (py) => (py - 115) / 45; // PDF px → metres

const mat = (name, color, rough = 0.8, metal = 0) => { const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal }); m.name = name; return m; };
const M = {
  floor: mat('floor', 0xe9e3d9), wall: mat('wall', 0xf7f6f4, 0.9), ink: mat('chair_black', 0x201e1d, 0.6),
  steel: mat('steel', 0x9c9893, 0.4, 0.3), saffron: mat('monk_cushion', 0xe07a1f, 0.7), cloth: mat('table_cloth', 0xfbfaf8, 0.9),
  wood: mat('wood', 0x9a6b43, 0.6), gold: mat('gold', 0xd4ae52, 0.35, 0.3), sofa: mat('sofa', 0x35312f, 0.7),
  accent: mat('accent_line', 0xec3013, 0.6), line: mat('zone_line', 0x6f6a66, 0.6), door: mat('door', 0x3b5f8f, 0.6),
  stage: mat('platform', 0xd8cfc2, 0.8), glass: mat('frame_photo', 0x5a4a3a, 0.5), plant: mat('plant', 0x4f7a3a, 0.8)
};
const root = new THREE.Group(); root.name = 'room_6AB';
const box = (name, m, w, h, d, x, y, z, parent = root, ry = 0) => {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.name = name;
  o.position.set(x, y, z); o.rotation.y = ry; parent.add(o); return o;
};
// plan-rect helper (px coords) → box on floor
const rect = (name, m, x0, x1, y0, y1, h, base = 0) =>
  box(name, m, P(x1) - P(x0), h, Q(y1) - Q(y0), OX + (P(x0) + P(x1)) / 2, base + h / 2, OZ + (Q(y0) + Q(y1)) / 2);
const outline = (name, m, x0, x1, y0, y1, t = 0.06) => {
  const a = OX + P(x0), b = OX + P(x1), c = OZ + Q(y0), d = OZ + Q(y1), y = 0.006;
  box(name + '_n', m, b - a, 0.01, t, (a + b) / 2, y, c); box(name + '_s', m, b - a, 0.01, t, (a + b) / 2, y, d);
  box(name + '_w', m, t, 0.01, d - c, a, y, (c + d) / 2); box(name + '_e', m, t, 0.01, d - c, b, y, (c + d) / 2);
};

// floor + walls
box('floor', M.floor, W, 0.1, D, 0, -0.05, 0);
const WH = 2.6, WT = 0.2;
box('wall_top', M.wall, W + WT * 2, WH, WT, 0, WH / 2, OZ - WT / 2);
box('wall_bottom', M.wall, W + WT * 2, WH, WT, 0, WH / 2, -OZ + WT / 2);
box('wall_right', M.wall, WT, WH, D, -OX + WT / 2, WH / 2, 0);
// left wall with 4 double-door openings
const openings = [[565, 655], [730, 820], [1168, 1258], [1333, 1420]].map(([a, b]) => [Q(a), Q(b)]);
let zc = 0;
[...openings, [D, D]].forEach(([a, b], i) => {
  if (a > zc) box('wall_left_' + i, M.wall, WT, WH, a - zc, OX - WT / 2, WH / 2, OZ + (zc + a) / 2);
  if (b > a) { // opened leaves swinging outward
    const half = (b - a) / 2;
    box('door_' + i + 'a', M.door, half, 2.1, 0.05, OX - WT - half / 2, 1.05, OZ + a + 0.03);
    box('door_' + i + 'b', M.door, half, 2.1, 0.05, OX - WT - half / 2, 1.05, OZ + b - 0.03);
    box('door_head_' + i, M.wall, WT, WH - 2.2, b - a, OX - WT / 2, 2.2 + (WH - 2.2) / 2, OZ + (a + b) / 2);
  }
  zc = b;
});
// columns
[164, 434, 704, 974].forEach((x, i) => { box('col_top_' + i, M.wall, 0.5, WH + 0.1, 0.4, OX + P(x), (WH + 0.1) / 2, OZ + 0.2); box('col_bot_' + i, M.wall, 0.5, WH + 0.1, 0.4, OX + P(x), (WH + 0.1) / 2, -OZ - 0.2); });
[480, 840, 1090, 1450].forEach((y, i) => box('col_right_' + i, M.wall, 0.4, WH + 0.1, 0.5, -OX - 0.2, (WH + 0.1) / 2, OZ + Q(y)));
// back strip partition + stairs + counter
box('partition_back', M.wall, W, WH, 0.12, 0, WH / 2, OZ + Q(268));
for (let s = 0; s < 10; s++) box('stair_' + s, M.wall, P(1159) - P(1049), 0.17 * (s + 1), 0.26, OX + (P(1049) + P(1159)) / 2, 0.085 * (s + 1), OZ + Q(262) - 0.13 - s * 0.26);
rect('counter_right', M.wall, 965, 1229, 275, 340, 1.0);
// small room (left)
const sx0 = P(160), sx1 = P(233), sz0 = Q(868), sz1 = Q(1097);
box('booth_wall_e', M.wall, 0.1, WH, sz1 - sz0, OX + sx1, WH / 2, OZ + (sz0 + sz1) / 2);
box('booth_wall_s', M.wall, sx1 - sx0, WH, 0.1, OX + (sx0 + sx1) / 2, WH / 2, OZ + sz1);
box('booth_wall_n', M.wall, 0.4, WH, 0.1, OX + sx1 - 0.2, WH / 2, OZ + sz0);

// chair builders (local: sitter faces -Z, backrest at +Z)
function chair(name, x, z, ry, seatM, frameM = M.steel, s = 0.46, base = 0) {
  const g = new THREE.Group(); g.name = name; g.position.set(x, base, z); g.rotation.y = ry;
  box(name + '_seat', seatM, s, 0.08, s, 0, 0.45, 0, g);
  box(name + '_back', seatM, s, 0.42, 0.06, 0, 0.72, s / 2 - 0.03, g);
  box(name + '_leg_l', frameM, 0.03, 0.45, s - 0.04, -s / 2 + 0.03, 0.22, 0, g);
  box(name + '_leg_r', frameM, 0.03, 0.45, s - 0.04, s / 2 - 0.03, 0.22, 0, g);
  root.add(g); return g;
}
function sofa(name, x, z, w) {
  const g = new THREE.Group(); g.name = name; g.position.set(x, 0, z);
  box(name + '_seat', M.sofa, w - 0.04, 0.42, 0.78, 0, 0.21, 0, g);
  box(name + '_back', M.sofa, w - 0.04, 0.45, 0.18, 0, 0.62, 0.3, g);
  box(name + '_arm_l', M.sofa, 0.1, 0.25, 0.7, -w / 2 + 0.07, 0.54, 0, g);
  box(name + '_arm_r', M.sofa, 0.1, 0.25, 0.7, w / 2 - 0.07, 0.54, 0, g);
  root.add(g);
}
function table(name, m, x0, x1, y0, y1, h = 0.75, base = 0) {
  rect(name + '_top', m, x0, x1, y0, y1, 0.04, base + h - 0.04);
  rect(name + '_skirt', M.cloth, x0 + 1, x1 - 1, y0 + 1, y1 - 1, h - 0.04, base);
}

// ── อาสน์สงฆ์ (platform) ──
const PH = 0.4;
rect('platform', M.stage, 420, 965, 277, 415, PH);
// ที่วางตาลปัตร
for (let i = 0; i < 8; i++) {
  const x0 = 502 + i * 52.4, x1 = x0 + 50;
  rect('fan_stand_' + i, M.wood, x0, x1, 279, 306, 0.6, PH);
  const cx = OX + (P(x0) + P(x1)) / 2, cz = OZ + Q(292);
  box('fan_pole_' + i, M.wood, 0.03, 1.2, 0.03, cx, PH + 0.6 + 0.6, cz);
  const fan = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.02, 32), M.gold);
  fan.name = 'fan_' + i; fan.scale.set(0.8, 1, 1.2); fan.rotation.x = Math.PI / 2; fan.position.set(cx, PH + 1.6, cz); root.add(fan);
}
const monkX = [575, 616, 657, 697, 738, 778, 819, 859, 900];
monkX.forEach((x, i) => chair('monk_row1_' + i, OX + P(x + 12), OZ + Q(329), Math.PI, M.saffron, M.wood, 0.55, PH));
table('monk_table_row1', M.cloth, 515, 921, 348, 375, 0.45, PH);
monkX.forEach((x, i) => chair('monk_row2_' + i, OX + P(x + 12), OZ + Q(504), Math.PI, M.saffron, M.wood, 0.55));
table('monk_table_row2', M.cloth, 515, 921, 524, 551, 0.75);
// โต๊ะหมู่ (tiered altar)
[[425, 493, 319, 386, 0.5], [432, 486, 326, 370, 0.35], [440, 478, 332, 356, 0.3]].reduce((y, [a, b, c, d, h], i) => { rect('altar_tier_' + i, i ? M.gold : M.wood, a, b, c, d, h, y); return y + h; }, PH);
// รูปพระบรมฉายาลักษณ์
box('portrait_stand', M.wood, P(408) - P(362), 0.9, 0.3, OX + P(385), 0.45, OZ + Q(380));
box('portrait_frame', M.gold, 0.9, 1.15, 0.06, OX + P(385), 0.9 + 0.6, OZ + Q(380));
box('portrait_image', M.glass, 0.74, 0.96, 0.02, OX + P(385), 1.5, OZ + Q(380) + 0.035);

// ── โต๊ะฉันภัตตาหาร (red zone) ──
outline('zone_ceremony', M.accent, 160, 310, 277, 543, 0.08);
table('desk_chaokhun', M.wood, 233, 257, 307, 355, 0.75);
chair('chair_chaokhun', OX + P(217), OZ + Q(331), -Math.PI / 2, M.ink);
{
  const cx = OX + P(233), cz = OZ + Q(468);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.04, 48), M.cloth); top.name = 'round_table_top'; top.position.set(cx, 0.73, cz); root.add(top);
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.74, 0.74, 0.71, 48), M.cloth); skirt.name = 'round_table_skirt'; skirt.position.set(cx, 0.355, cz); root.add(skirt);
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, x = cx + Math.cos(a) * 1.1, z = cz + Math.sin(a) * 1.1; chair('round_chair_' + i, x, z, Math.atan2(-(cx - x), -(cz - z)) + Math.PI, M.ink); }
}

// ── โซฟาผู้บริหาร + coffee tables ──
[[421, 476], [521, 576], [607, 662], [693, 748], [779, 834], [864, 919], [961, 1015]].forEach(([a, b], i) => table('coffee_table_' + i, M.wood, a, b, 660, 687, 0.45));
const sw = (P(1039) - P(395)) / 16;
for (let i = 0; i < 16; i++) sofa('sofa_' + i, OX + P(395) + sw * (i + 0.5), OZ + Q(727), sw);

// ── เก้าอี้อบรม 15 × 30 ──
outline('zone_seating', M.line, 328, 1154, 779, 1497, 0.05);
const blocks = [377, 647, 917], pitch = 22.6 / 45;
for (let r = 0; r < 15; r++) {
  const z = OZ + (r < 9 ? 15.18 + r : 25.22 + (r - 9));
  blocks.forEach((bx, b) => { for (let c = 0; c < 10; c++) chair(`seat_r${r + 1}_b${b + 1}_${c + 1}`, OX + P(bx) + pitch * (c + 0.5), z, 0, M.ink); });
}

// ── Station Live & Sound / จุดวางเครื่องไทยธรรม ──
table('station_live_sound', M.ink, 1153, 1187, 363, 490, 0.8);
box('station_monitor', M.ink, 0.05, 0.4, 0.7, OX + P(1180), 1.0, OZ + Q(426));
table('offering_point', M.cloth, 1153, 1187, 496, 620, 0.75);
outline('zone_side', M.line, 1164, 1231, 880, 1097, 0.05);

stage.setObject(root);

// ── views ──
const cam = stage._camera, ctl = stage._controls;
cam.far = 500; cam.updateProjectionMatrix();
const VIEWS = {
  oblique: [[7, 24, 20], [0, 0, -3]],
  top: [[0, 44, 0.01], [0, 0, 0]],
  back: [[0, 3.4, 18], [0, 0.8, -8]],
  front: [[0, 3.2, -16], [0, 0.6, 4]]
};
const setView = (k) => {
  const [p, t] = VIEWS[k]; cam.position.set(...p); ctl.target.set(...t); ctl.update();
  document.querySelectorAll('#views [data-view]').forEach(b => b.className = 'btn ' + (b.dataset.view === k ? 'btn-primary' : 'btn-secondary'));
};
document.querySelectorAll('#views [data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
setView('oblique');

// ── labels ──
const L = [
  ['ที่วางตาลปัตร', 710, 292, 2.4],
  ['โต๊ะที่นั่งพระสงฆ์', 718, 340, 1.5],
  ['ที่นั่งพระสงฆ์รับบาตร', 718, 520, 1.4],
  ['โต๊ะหมู่', 459, 352, 1.7],
  ['รูปพระบรมฉายาลักษณ์', 385, 380, 2.4],
  ['โต๊ะฉันภัตตาหาร เจ้าคุณธงชัย', 240, 331, 1.3],
  ['โต๊ะฉันภัตตาหาร พระ 8 รูป', 233, 468, 1.3],
  ['โซฟาผู้บริหาร จำนวน 16 ที่', 717, 727, 1.3],
  ['Station Live & Sound', 1170, 426, 1.5],
  ['จุดวางเครื่องไทยธรรม สังฆทาน', 1170, 558, 1.3],
  ['เก้าอี้อบรม 450 ตัว', 760, 1138, 1.4]
].map(([t, x, y, h]) => {
  const el = document.createElement('div');
  el.textContent = t;
  el.style.cssText = 'position:absolute;left:0;top:0;white-space:nowrap;font:600 12px var(--font-body),"Noto Sans Thai",sans-serif;background:#fff;color:#201e1d;border:2px solid #201e1d;padding:2px 6px;transform-origin:0 0';
  document.getElementById('labels').appendChild(el);
  return { el, v: new THREE.Vector3(OX + P(x), h, OZ + Q(y)) };
});
let showLabels = true;
document.getElementById('toggleLabels').onclick = (e) => { showLabels = !showLabels; e.target.textContent = showLabels ? 'ซ่อนป้าย' : 'แสดงป้าย'; };
const tmp = new THREE.Vector3();
(function tick() {
  const w = stage.clientWidth, h = stage.clientHeight;
  const placed = [];
  for (const { el, v } of L) {
    tmp.copy(v).project(cam);
    const vis = showLabels && tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    el.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    const lw = el.offsetWidth, lh = el.offsetHeight;
    let x = (tmp.x + 1) / 2 * w - lw / 2, y = (1 - tmp.y) / 2 * h - lh;
    for (let n = 0; n < 12; n++) {
      const hit = placed.find(r => x < r.x + r.w + 4 && x + lw + 4 > r.x && y < r.y + r.h + 2 && y + lh + 2 > r.y);
      if (!hit) break;
      y = hit.y - lh - 3;
    }
    placed.push({ x, y, w: lw, h: lh });
    el.style.transform = `translate(${x}px,${y}px)`;
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
